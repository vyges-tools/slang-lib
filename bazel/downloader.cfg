# SPDX-License-Identifier: Apache-2.0
# Where Bazel fetches what MODULE.bazel pins.
#
# ⛔ slang's source archive: the registry pins GitHub's generated tarball of commit f04e8156 by its
# SHA-256, and GitHub has since regenerated that tarball (its `.git_archival.txt` now abbreviates
# the commit one digit longer; every source file is unchanged), so the registry's URL no longer
# serves the bytes the registry's checksum names. The original bytes — exactly the checksum the
# registry pins — are published as an asset of this repository's `source-sv-lang-f04e8156` release.
# Bazel still verifies them against the registry's integrity.
rewrite github.com/MikePopoloski/slang/archive/f04e81565793c768b747a8fd058f3e7aeceee1b5.tar.gz github.com/vyges-tools/slang-lib/releases/download/source-sv-lang-f04e8156/slang-f04e81565793c768b747a8fd058f3e7aeceee1b5.tar.gz
